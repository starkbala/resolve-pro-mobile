name: Build ResolvePro Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Force Create Flutter Project Structure & Inject Code
        run: |
          # Create fresh flutter project structure if missing
          flutter create --platforms=android --project-name resolve_pro_mobile .
          
          # Ensure directories exist
          mkdir -p lib shaders android/app/src/main
          
          # If main.dart was placed elsewhere or root, move it to lib/main.dart
          if [ -f "main.dart" ]; then
            mv main.dart lib/main.dart
          fi

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResolvePro-Mobile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
